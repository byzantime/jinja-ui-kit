[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "jinja-ui-kit"
version = "0.3.1"
description = "A collection of reusable Jinja2 macros for building web application UIs with Tailwind CSS styling"
dependencies = [
    "Jinja2>=3.0"
]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/byzantime/jinja-ui-kit"

[dependency-groups]
dev = [
    "playwright==1.62.0",
    "pytest",
    "ruff==0.16.9",
    "stifle==1.1.0",
]

[tool.flit.module]
name = "jinja_ui_kit"

[tool.flit.sdist]
include = [
    "src/jinja_ui_kit/dist/jinja-ui-kit.js",
    "src/jinja_ui_kit/dist/jinja-ui-kit.min.css",
    "src/jinja_ui_kit/styles/semantic.css",
    "src/jinja_ui_kit/templates/**/*.html",
    "README.md",
    "LICENSE.txt",
]
exclude = [
    "node_modules/",
    "package*.json",
    "tailwind.config.js",
    "src/styles/",
]

[tool.stifle]
max-doc-lines = 7

[tool.ruff]
src = ["src", "tests"]
