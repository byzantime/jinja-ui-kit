schema = 1

[setup]
run = "uv sync && uv run playwright install chromium-headless-shell"

[jobs.test]
run = "uv run pytest -q"

[jobs.stifle]
run = "uv run stifle check src tests"

[jobs.ruff-check]
run = "uv run ruff check src tests"

[jobs.ruff-format]
run = "uv run ruff format --check src tests"
